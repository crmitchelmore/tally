version: 2
updates:
  - package-ecosystem: npm
    directory: /tally-web
    schedule:
      interval: weekly
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
