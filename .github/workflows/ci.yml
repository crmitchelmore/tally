name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.scope.outputs.web }}
      ios: ${{ steps.scope.outputs.ios }}
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          web=false ios=false android=false
          if [[ -z "$BASE" ]]; then
            web=true ios=true android=true
          else
            git diff --no-renames --name-only -z "$BASE...$HEAD" > "$RUNNER_TEMP/changed"
            while IFS= read -r -d '' path; do
              case "$path" in
                tally-web/*) web=true ;;
                ios/*) ios=true ;;
                tally-android/*) android=true ;;
                docs/*|*.md) ;;
                *) web=true ios=true android=true ;;
              esac
            done < "$RUNNER_TEMP/changed"
          fi
          printf 'web=%s\nios=%s\nandroid=%s\n' "$web" "$ios" "$android" >> "$GITHUB_OUTPUT"
  # ─────────────────────────────────────────────────────────────
  # Web: lint + build
  # ─────────────────────────────────────────────────────────────
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tally-web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Verify shared app icons
        run: node ../scripts/verify-icons.cjs
      - name: Unit and capability tests
        run: bun run test
      - name: Typecheck
        run: bunx tsc --noEmit --incremental false
      - name: Lint
        run: bun run lint
      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Zm9yay1jaS5jbGVyay5hY2NvdW50cy5kZXYk' }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://fork-ci.convex.cloud' }}
          HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: bun run build

  # ─────────────────────────────────────────────────────────────
  # iOS: generate + build (macOS runner)
  # ─────────────────────────────────────────────────────────────
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Match the shipping SDK.
          xcode-version: "27.2.0"
      - name: Test Apple sign-in provisioning validation
        run: node ../scripts/apple-signin-profile.test.cjs
      - name: Install Tuist via mise
        uses: jdx/mise-action@v5
        with:
          install_args: tuist@4.32.0
      - name: Generate Xcode project
        run: |
          mise use -g tuist@4.32.0
          tuist install
          tuist generate --no-open
      - name: Build iOS app
        run: |
          set -o pipefail
          # Xcode 27 rejects older targets in generated Swift package resource bundles.
          if command -v xcpretty >/dev/null 2>&1; then
            xcodebuild \
              -workspace Tally.xcworkspace \
              -scheme App \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              build \
              IPHONEOS_DEPLOYMENT_TARGET=17.0 \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty
          else
            xcodebuild \
              -workspace Tally.xcworkspace \
              -scheme App \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              build \
              IPHONEOS_DEPLOYMENT_TARGET=17.0 \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi

  # ─────────────────────────────────────────────────────────────
  # Android: lint + build (ubuntu runner)
  # ─────────────────────────────────────────────────────────────
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tally-android
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build Android app
        run: ./gradlew assembleDebug --no-daemon
      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Upload Android preview APK
        uses: actions/upload-artifact@v7
        with:
          name: tally-android-debug
          path: tally-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  # Required branch-protection status context (configured as "build")
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [changes, web, ios, android]
    if: always()
    steps:
      - name: Verify selected builds
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            . as $jobs | .changes.result == "success" and
            all(["web", "ios", "android"][];
              . as $platform | $jobs[$platform].result ==
                (if $jobs.changes.outputs[$platform] == "true" then "success" else "skipped" end))
          ' <<< "$RESULTS"

  # ─────────────────────────────────────────────────────────────
  # Auto Version & Release (iOS)
  # ─────────────────────────────────────────────────────────────
  auto-release:
    name: Auto Version & Release
    concurrency:
      group: tally-auto-release
      cancel-in-progress: false
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_RELEASE_TOKEN }}
          persist-credentials: true

      - name: Determine version bump from conventional commits
        id: bump
        run: |
          set -e

          # Get latest base ios-vX.Y.Z tag (ignore build tags like ios-v1.2.3-26021467)
          LATEST_TAG=$(git tag -l 'ios-v*' --sort=-v:refname | grep -E '^ios-v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -n "$LATEST_TAG" ]; then
            echo "Latest tag: $LATEST_TAG"
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" --no-merges)
            BODIES=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%b" --no-merges)
          else
            echo "No previous ios-v* tag found — scanning all commits"
            COMMITS=$(git log HEAD --pretty=format:"%s" --no-merges)
            BODIES=$(git log HEAD --pretty=format:"%b" --no-merges)
            LATEST_TAG="ios-v0.0.0"
          fi

          if [ -z "$COMMITS" ]; then
            echo "No new commits since $LATEST_TAG"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Commits since $LATEST_TAG:"
          echo "$COMMITS"
          echo "---"

          # Determine bump type from conventional commits
          BUMP="none"

          # Check for breaking changes: "type!:" prefix or "BREAKING CHANGE:" in body
          if echo "$COMMITS" | grep -qE "^[a-z]+(\(.+\))?!:"; then
            BUMP="major"
          elif echo "$BODIES" | grep -qE "^BREAKING CHANGE:"; then
            BUMP="major"
          # Check for features
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
          # Check for fixes and performance improvements
          elif echo "$COMMITS" | grep -qE "^(fix|perf)(\(.+\))?:"; then
            BUMP="patch"
          fi

          if [ "$BUMP" = "none" ]; then
            echo "No releasable conventional commits (feat/fix/perf/breaking) found"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Parse current version and apply bump
          VERSION="${LATEST_TAG#ios-v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release tag format: $LATEST_TAG" >&2
            exit 1
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Version bump: $BUMP ($LATEST_TAG → ios-v$NEW_VERSION)"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Bump VERSION and create tag
        if: steps.bump.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.AUTO_RELEASE_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          TAG="ios-v${NEW_VERSION}"

          # Check if tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi

          RELEASE_SHA=$(git rev-parse HEAD)
          # A newer main push may have finished while this build was running.
          # Release only the current head; its own CI run will tag it when green.
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$RELEASE_SHA" != "$MAIN_SHA" ]; then
            echo "A newer main commit exists; skipping superseded release."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Tag the current commit (triggers ios-testflight.yml)
          git tag -a "$TAG" "$RELEASE_SHA" -m "Release $TAG"
          git push origin "$TAG"
          echo "🚀 Created tag $TAG on ${RELEASE_SHA:0:7}"

          # Best-effort VERSION file update
          echo "$NEW_VERSION" > ios/VERSION
          git add ios/VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump iOS version to $NEW_VERSION"
            git push origin main || echo "⚠️ Could not push VERSION bump (branch protection)"
          fi
