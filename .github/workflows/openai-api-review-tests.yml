name: OpenAI API Review Tests
on:
  pull_request:
    paths:
      - .github/scripts/openai-api-review.py
      - .github/scripts/test_openai_api_review.py
      - .github/workflows/openai-api-review*.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/openai-api-review.py
      - .github/scripts/test_openai_api_review.py
      - .github/workflows/openai-api-review*.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I .github/scripts/test_openai_api_review.py
