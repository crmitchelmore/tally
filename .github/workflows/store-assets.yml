name: Store Screenshots
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to capture
        type: choice
        default: all
        options: [all, ios, android]
  workflow_call:
    inputs:
      platform:
        description: Platforms to capture
        type: string
        default: all
permissions:
  contents: read
jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          working-directory: tally-android
          script: |
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell wm size 1080x1920
            adb shell am instrument -w -e class com.tally.app.StoreScreenshotTests app.tally.android.test/androidx.test.runner.AndroidJUnitRunner > store-test-result.txt
            cat store-test-result.txt
            grep -q 'OK (1 test)' store-test-result.txt
            mkdir -p store-assets
            adb exec-out run-as app.tally.android tar -C files/store-screenshots -cf - . > store-assets.tar
            tar -xf store-assets.tar -C store-assets
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-store-screenshots
          path: |
            tally-android/store-assets/
            tally-android/app/build/reports/androidTests/
            tally-android/store-test-result.txt
          retention-days: 30
  ios:
    if: inputs.platform != 'android'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2.0'
      - uses: jdx/mise-action@v5
        with:
          version: 2025.12.1
          install: false
      - name: Generate app
        working-directory: ios
        run: |
          mise install tuist@4.32.0
          mise exec tuist@4.32.0 -- tuist install
          mise exec tuist@4.32.0 -- tuist generate --no-open
      - name: Capture iPhone and iPad
        working-directory: ios
        run: |
          python3 - <<'PY'
          import json,subprocess
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          candidates=[d for runtime,group in devices.items() if '.iOS-' in runtime for d in group]
          for label,match in [('iphone','Pro Max'),('ipad','iPad Pro 13-inch')]:
              selected=next((d for d in candidates if match in d['name']),None)
              if not selected: raise SystemExit(f'No suitable {label} simulator')
              result=subprocess.run(['xcodebuild','test','-workspace','Tally.xcworkspace','-scheme','App','-destination',f'platform=iOS Simulator,id={selected["udid"]}','-parallel-testing-enabled','NO','-only-testing:AppUITests/StoreScreenshotTests','-only-testing:AppUITests/PrivacyChoiceTests', '-resultBundlePath',f'{label}.xcresult','CODE_SIGNING_ALLOWED=NO'])
              subprocess.run(['xcrun','xcresulttool','export','attachments','--path',f'{label}.xcresult','--output-path',f'store-assets/{label}'],check=True)
              result.check_returncode()
          PY
      - name: Prepare App Store uploads
        working-directory: ios
        run: |
          # Keep only the store captures, ordered, as opaque JPEGs ready for App Store Connect.
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          for label in ['iphone','ipad']:
              src=pathlib.Path('store-assets')/label
              out=pathlib.Path('store-assets/appstore')/label
              out.mkdir(parents=True,exist_ok=True)
              names=set()
              for test in json.loads((src/'manifest.json').read_text()):
                  for a in test.get('attachments',[]):
                      m=re.match(r'(0\d-[a-z-]+)',a.get('suggestedHumanReadableName',''))
                      if not m: continue
                      names.add(m.group(1))
                      subprocess.run(['sips','-s','format','jpeg','-s','formatOptions','95',str(src/a['exportedFileName']),'--out',str(out/f'{m.group(1)}.jpg')],check=True,capture_output=True)
                      if not (out/f'{m.group(1)}.jpg').stat().st_size: raise SystemExit(f'{label}: failed to convert {m.group(1)}')
              if len(names)<3: raise SystemExit(f'{label}: expected 3 store screenshots, found {sorted(names)}')
              print(label, sorted(names))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-store-screenshots
          path: |
            ios/store-assets/
            ios/iphone.xcresult
            ios/ipad.xcresult
          retention-days: 30
