name: Store Screenshots
on:
  workflow_dispatch:
  push:
    branches: [codex/store-readiness]
    paths: [.github/workflows/store-assets.yml]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          working-directory: tally-android
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.tally.app.StoreScreenshotTests --no-daemon
            mkdir -p store-assets
            adb exec-out run-as com.tally.app tar -C files/store-screenshots -cf - . | tar -xf - -C store-assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-store-screenshots
          path: tally-android/store-assets/
          retention-days: 30
  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2025.12.1
          install: false
      - name: Generate app
        working-directory: ios
        run: |
          mise install tuist@4.32.0
          mise exec tuist@4.32.0 -- tuist install
          mise exec tuist@4.32.0 -- tuist generate --no-open
      - name: Capture iPhone and iPad
        working-directory: ios
        run: |
          python3 - <<'PY'
          import json,subprocess
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          candidates=[d for runtime,group in devices.items() if '.iOS-' in runtime for d in group]
          for label,match in [('iphone','Pro Max'),('ipad','iPad Pro 13-inch')]:
              selected=next((d for d in candidates if match in d['name']),None)
              if not selected: raise SystemExit(f'No suitable {label} simulator')
              subprocess.run(['xcodebuild','test','-workspace','Tally.xcworkspace','-scheme','App','-destination',f'platform=iOS Simulator,id={selected["udid"]}','-parallel-testing-enabled','NO','-only-testing:AppUITests/StoreScreenshotTests', '-resultBundlePath',f'{label}.xcresult','CODE_SIGNING_ALLOWED=NO'],check=True)
              subprocess.run(['xcrun','xcresulttool','export','attachments','--path',f'{label}.xcresult','--output-path',f'store-assets/{label}'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-store-screenshots
          path: |
            ios/store-assets/
            ios/iphone.xcresult
            ios/ipad.xcresult
          retention-days: 30
